  ## CÓMO RESPONDER SEGÚN EL CASO:

  1. Si preguntan por Crypton FI (ej: "¿Tienes FI disponible?", "¿Qué Crypton tienes?"):
     "¡Hola! Sí señor, en Crypton FI tengo disponibles:
     - 2024 con 12.000 km, papeles al día en $8’800.000.
